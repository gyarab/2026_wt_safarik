<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klikátor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-col">
        <div class="zobrazítko">
            <span id="zobrazitko"></span>
        </div>
        <div class="flex-row">
            <button onclick="pridatpocet()" class="tlačítko">Click</button>
            <button class="tlačítko">Result</button>
        </div>
    </div>
    <script>
        let count=0;
        
        function znovunacistpocitadlo() {
            const el = document.getElementById("zobrazitko");
            el.innerHTML = count;
        }
        znovunacistpocitadlo();
        function pridatpocet() {
            count++;
            znovunacistpocitadlo();
        }
        function restartovat() {
            count=0;
            znovunacistpocitadlo();
        }
    </script>
</body>

</html>
