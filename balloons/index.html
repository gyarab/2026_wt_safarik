<!DOCTYPE html>
<html lang="cs" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloons</title>
    <!-- Vlastní CSS pro hrací plochu a „balónky“ je už připravené níže v <style>. Dnes píšeme jen HTML s Bootstrapem. -->

    <!-- Bootstrap 6 (alpha) – CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        /* ===== HRACÍ PLOCHA = obloha ===== */
        .plocha {
            position: relative;      /* „balónky“ se umisťují vůči ploše */
            height: 60vh;
            min-height: 320px;
            overflow: hidden;        /* co vyletí ven, není vidět */
            background: linear-gradient(#8ecae6, #e0f4ff);
            user-select: none;
        }
        .plocha-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: 1rem;
            margin: 0;
            text-align: center;
            font-size: 1.25rem;
            color: #335;
        }

        /* ===== JEDEN „BALÓNEK“ – zatím barevný čtverec s kulatými rohy ===== */
        .balonek {
            position: absolute;      /* JS nastaví left a top v % */
            translate: -50% -50%;    /* left/top = STŘED čtverce */
            width: 3.5rem;
            height: 3.5rem;
            padding: 0;
            border: 0;
            border-radius: .75rem;
            background-color: tomato;     /* JS nastaví náhodnou barvu */
            cursor: pointer;
        }
        /* volitelně: místo barvy obrázek (img/beruska.svg …) */
        .balonek.obrazek {
            background-color: transparent;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>
<body>

    <!-- Ukazatel aktuálního breakpointu (vpravo dole). Až bude stránka hotová, můžeš ho smazat. -->
    <div class="position-fixed bottom-0 end-0 m-3 badge theme-inverse fs-md" style="z-index: 10">

        <span class="d-none md:d-inline lg:d-none">MD ≥ 768</span>
        <span class="d-none lg:d-inline xl:d-none">LG ≥ 1024</span>
        <span class="d-none xl:d-inline 2xl:d-none">XL ≥ 1280</span>
        <span class="d-none 2xl:d-inline">2XL ≥ 1536</span>
    </div>

    <!-- ===== HLAVIČKA (úkol P3) ===== -->
    <nav class="bg-1">
        <div class="container">
            <h1 class="h3 py-1">Název</h1>
        </div>
    </nav>

    <!-- ===== OBSAH: řádek se dvěma sloupci (úkol P4) ===== -->
    <!--      vlevo / nahoře: karta s formulářem (úkoly P6, P7)        -->
    <!--      vpravo / dole:  stav hry + hrací plocha (úkol P5)        -->
    <main class="container">
        <div class="row">
            <aside class="col-12 lg:col-4">nastavení</aside>
            <section class="col-12 lg:col-8 ">
                <div class="plocha"></div>
            </section>
        </div>
        
    </main>

    <!-- Bootstrap 6 – JS (je to ES modul => type="module") -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
